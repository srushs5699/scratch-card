<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Scratch to Reveal</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .gift {
      font-size: 44px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .muted {
      color: #6b7280;
    }

    .scratch-card {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      background: #fff3df;
      margin-top: 24px;
    }

    .reveal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      gap: 10px;
      background: #fff3df;
    }

    .reveal .emoji {
      font-size: 52px;
    }

    .reveal .small {
      color: #6b7280;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .reveal .big {
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 800;
    }

    .reveal .sub {
      font-size: 20px;
      font-weight: 700;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #6b7280;
      min-height: 22px;
    }

    #celebration {
      display: none;
      margin-top: 14px;
      font-weight: 700;
      font-size: 18px;
    }

    button {
      margin-top: 18px;
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .scratch-card { height: 290px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="gift">🎁</div>
    <h1>Mom & Dad</h1>
    <p class="muted">I have something special to tell you.</p>
    <p><strong>Scratch below to reveal it ❤️</strong></p>

    <div class="scratch-card" id="card">
      <div class="reveal">
        <div class="emoji">🎉</div>
        <div class="small">Surprise!</div>
        <div class="big">JOB AT AMAZON ✅</div>
        <div class="sub">I DID IT! ❤️</div>
        <div class="muted">— Srushti</div>
      </div>

      <canvas id="scratchCanvas"></canvas>
    </div>

    <div id="status">👆 Scratch with your finger</div>

    <div id="celebration">
      🎊 ✨ 🎉 ✨ 🎊<br>
      Your daughter is going to Amazon! ❤️
    </div>

    <button id="resetBtn" type="button">Scratch again</button>
  </main>

  <script>
    const canvas = document.getElementById("scratchCanvas");
    const ctx = canvas.getContext("2d");
    const card = document.getElementById("card");
    const status = document.getElementById("status");
    const celebration = document.getElementById("celebration");

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function sizeAndPaint() {
      const rect = card.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = "source-over";

      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, "#8d9197");
      grad.addColorStop(0.5, "#c6c8cc");
      grad.addColorStop(1, "#7f848b");

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = "rgba(255,255,255,.16)";
      for (let i = 0; i < 220; i++) {
        ctx.beginPath();
        ctx.arc(
          Math.random() * rect.width,
          Math.random() * rect.height,
          Math.random() * 2 + 0.5,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "700 24px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText("SCRATCH TO REVEAL ✨", rect.width / 2, rect.height / 2 - 12);

      ctx.font = "16px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText("Something exciting is hiding here…", rect.width / 2, rect.height / 2 + 24);

      canvas.style.opacity = "1";
      canvas.style.pointerEvents = "auto";
      celebration.style.display = "none";
      status.textContent = "👆 Scratch with your finger";
    }

    function getPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function eraseAt(x, y) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 46;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, 23, 0, Math.PI * 2);
      ctx.fill();

      lastX = x;
      lastY = y;
    }

    function begin(clientX, clientY) {
      isDrawing = true;
      const p = getPos(clientX, clientY);
      lastX = p.x;
      lastY = p.y;
      eraseAt(p.x, p.y);
    }

    function move(clientX, clientY) {
      if (!isDrawing) return;
      const p = getPos(clientX, clientY);
      eraseAt(p.x, p.y);
    }

    function end() {
      isDrawing = false;
    }

    canvas.addEventListener("mousedown", (e) => {
      e.preventDefault();
      begin(e.clientX, e.clientY);
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      move(e.clientX, e.clientY);
    });

    window.addEventListener("mouseup", end);

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      const t = e.touches[0];
      begin(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      const t = e.touches[0];
      move(t.clientX, t.clientY);
    }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
      e.preventDefault();
      end();
    }, { passive: false });

    document.getElementById("resetBtn").addEventListener("click", sizeAndPaint);

    window.addEventListener("load", () => {
      requestAnimationFrame(() => {
        requestAnimationFrame(sizeAndPaint);
      });
    });

    window.addEventListener("resize", sizeAndPaint);
  </script>
</body>
</html>
