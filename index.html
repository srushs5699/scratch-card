<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Scratch to Reveal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .wrap {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .muted {
      color: #6b7280;
    }

    .scratch-card {
      position: relative;
      width: 100%;
      height: 320px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      background: white;
      margin-top: 24px;
    }

    .reveal {
      position: absolute;
      inset: 0;

      background-image: url("image.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: white;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      cursor: crosshair;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #6b7280;
      min-height: 22px;
    }

    #celebration {
      display: none;
      margin-top: 14px;
      font-weight: 700;
      font-size: 18px;
    }

    button {
      margin-top: 18px;
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .scratch-card {
        height: 290px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <h1>Scratch Below Card!</h1>

    <div class="scratch-card" id="card">

      <div class="reveal"></div>

      <canvas id="scratchCanvas"></canvas>

    </div>

    <div id="status">
      👆 Scratch with your finger
    </div>

    <div id="celebration">
      🎊 ✨ 🎉 ✨ 🎊
      <br />
      Your daughter is going to Amazon! ❤️
    </div>

    <button id="resetBtn" type="button">
      Scratch again
    </button>

  </main>

  <script>
    const canvas = document.getElementById("scratchCanvas");
    const ctx = canvas.getContext("2d");

    const card = document.getElementById("card");
    const status = document.getElementById("status");
    const celebration = document.getElementById("celebration");

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;

    function sizeAndPaint() {
      const rect = card.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);

      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.globalCompositeOperation = "source-over";

      const gradient = ctx.createLinearGradient(
        0,
        0,
        rect.width,
        rect.height
      );

      gradient.addColorStop(0, "#8d9197");
      gradient.addColorStop(0.5, "#c6c8cc");
      gradient.addColorStop(1, "#7f848b");

      ctx.fillStyle = gradient;
      ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );

      ctx.fillStyle = "rgba(255,255,255,.16)";

      for (let i = 0; i < 220; i++) {
        ctx.beginPath();

        ctx.arc(
          Math.random() * rect.width,
          Math.random() * rect.height,
          Math.random() * 2 + 0.5,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.font =
        "700 24px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";

      ctx.fillText(
  "SCRATCH HERE!",
  rect.width / 2,
  rect.height / 2
);

      canvas.style.opacity = "1";
      canvas.style.pointerEvents = "auto";

      celebration.style.display = "none";

      status.textContent =
        "👆 Scratch with your finger";
    }

    function getPosition(clientX, clientY) {
      const rect =
        canvas.getBoundingClientRect();

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function eraseAt(x, y) {
      ctx.globalCompositeOperation =
        "destination-out";

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 50;

      ctx.beginPath();

      ctx.moveTo(
        lastX,
        lastY
      );

      ctx.lineTo(
        x,
        y
      );

      ctx.stroke();

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI * 2
      );

      ctx.fill();

      lastX = x;
      lastY = y;
    }

    function beginScratch(clientX, clientY) {
      isDrawing = true;

      const point =
        getPosition(clientX, clientY);

      lastX = point.x;
      lastY = point.y;

      eraseAt(
        point.x,
        point.y
      );
    }

    function moveScratch(clientX, clientY) {
      if (!isDrawing) {
        return;
      }

      const point =
        getPosition(clientX, clientY);

      eraseAt(
        point.x,
        point.y
      );
    }

    function endScratch() {
      isDrawing = false;
    }

    canvas.addEventListener(
      "mousedown",
      (event) => {
        event.preventDefault();

        beginScratch(
          event.clientX,
          event.clientY
        );
      }
    );

    window.addEventListener(
      "mousemove",
      (event) => {
        if (!isDrawing) {
          return;
        }

        event.preventDefault();

        moveScratch(
          event.clientX,
          event.clientY
        );
      }
    );

    window.addEventListener(
      "mouseup",
      endScratch
    );

    canvas.addEventListener(
      "touchstart",
      (event) => {
        event.preventDefault();

        const touch =
          event.touches[0];

        beginScratch(
          touch.clientX,
          touch.clientY
        );
      },
      {
        passive: false
      }
    );

    canvas.addEventListener(
      "touchmove",
      (event) => {
        event.preventDefault();

        const touch =
          event.touches[0];

        moveScratch(
          touch.clientX,
          touch.clientY
        );
      },
      {
        passive: false
      }
    );

    canvas.addEventListener(
      "touchend",
      (event) => {
        event.preventDefault();

        endScratch();

        celebration.style.display =
          "block";

        status.textContent =
          "🎉 SURPRISE!";
      },
      {
        passive: false
      }
    );

    document
      .getElementById("resetBtn")
      .addEventListener(
        "click",
        sizeAndPaint
      );

    window.addEventListener(
      "load",
      () => {
        requestAnimationFrame(
          () => {
            requestAnimationFrame(
              sizeAndPaint
            );
          }
        );
      }
    );

    window.addEventListener(
      "resize",
      sizeAndPaint
    );
  </script>

</body>
</html>
